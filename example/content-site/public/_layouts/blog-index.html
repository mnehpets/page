{{define "blog-index"}}
<h1>{{.Meta.Title}}</h1>
<ul class="post-list">
  {{range sortByDate (.Site.ByCollection "blog")}}
  <li>
    <time datetime="{{.Meta.Date.Format "2006-01-02"}}">{{.Meta.Date.Format "2 Jan 2006"}}</time>
    — <a href="{{ $.Href . }}">{{.Meta.Title}}</a>
    {{with .Meta.Description}}<p>{{.}}</p>{{end}}
  </li>
  {{end}}
</ul>
{{end}}
